<circle cx="524" cy="106" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<circle cx="500" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="500" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">3</text><text x="500" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Contact</text><text x="500" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Ball touches the pads of</text><text x="500" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">all ten fingers, not the</text><text x="500" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">palms</text>
<line x1="560" y1="200" x2="640" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="702.8" cy="130.013" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M702 154L700 214"/><path d="M700 214L706 256L708 300"/><path d="M700 214L694 256L690 300"/><path d="M701.84 160L722 130L730 96"/><path d="M701.84 160L714 128L722 94"/></g>
<circle cx="740" cy="62" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<line x1="730" y1="88" x2="738" y2="74" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#ahb)"/>
<circle cx="700" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="700" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">4</text><text x="700" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Extend</text><text x="700" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Push with legs and arms</text><text x="700" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">toward the target. Finish</text><text x="700" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">high</text>
</svg>
