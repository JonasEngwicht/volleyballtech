<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Four phases of an overhead volleyball set: move under the ball, hands up early forming a window above the forehead, catch-like contact on the finger pads, extend arms and legs toward the target">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="480" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Overhead set in 4 steps (side view)</text>
<line x1="40" y1="300" x2="760" y2="300" stroke="#0f1f3d" stroke-width="4" stroke-linecap="round"/>
<circle cx="119.114" cy="153.078" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M112 176L94 234"/><path d="M94 234L114 264L106 300"/><path d="M94 234L84 264L74 300"/><path d="M110.56 182L128 202L146 210"/></g>
<circle cx="100" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="100" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">1</text><text x="100" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Get there</text><text x="100" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Move under the ball early</text><text x="100" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">and face your target</text>
<line x1="160" y1="200" x2="240" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="302.8" cy="136.013" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M302 160L300 220"/><path d="M300 220L310 260L310 300"/><path d="M300 220L290 260L286 300"/><path d="M301.84 166L326 152L328 120"/><path d="M301.84 166L318 150L320 118"/></g>
<circle cx="324" cy="100" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<circle cx="300" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="300" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">2</text><text x="300" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Hands up</text><text x="300" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Hands above the forehead,</text><text x="300" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">thumbs and index fingers</text><text x="300" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">form a window</text>
<line x1="360" y1="200" x2="440" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
