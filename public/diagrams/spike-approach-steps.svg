<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Four phases of a volleyball spike: approach steps, a quick right-left plant with both arms swinging back, two-foot jump with arms up and hitting elbow drawn back, contact at the highest point with a wrist snap">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="480" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Spike: approach, jump and arm swing (right-handed)</text>
<line x1="40" y1="300" x2="760" y2="300" stroke="#0f1f3d" stroke-width="4" stroke-linecap="round"/>
<circle cx="122.593" cy="144.923" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M116 168L100 224"/><path d="M100 224L120 260L134 300"/><path d="M100 224L86 264L70 294"/><path d="M114.72 174L86 190L66 204"/></g>
<circle cx="100" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="100" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">1</text><text x="100" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Approach</text><text x="100" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Left, right, left: slow</text><text x="100" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">first steps, then faster</text>
<line x1="160" y1="200" x2="240" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="310.219" cy="156.374" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M306 180L296 236"/><path d="M296 236L316 266L318 300"/><path d="M296 236L282 268L294 300"/><path d="M305.2 186L280 200L258 210"/></g>
<circle cx="300" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="300" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">2</text><text x="300" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Plant</text><text x="300" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Big last steps: right, then</text><text x="300" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">left. Both arms swing back</text>
<line x1="360" y1="200" x2="440" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<ellipse cx="500" cy="302" rx="26" ry="5" fill="#c9d3e3"/>
<circle cx="505.596" cy="90.0532" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M504 114L500 174"/><path d="M500 174L510 210L502 246"/><path d="M500 174L490 210L486 248"/><path d="M503.68 120L526 94L536 66"/><path d="M503.68 120L474 110L472 80"/></g>
<circle cx="556" cy="54" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<circle cx="500" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="500" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">3</text><text x="500" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Jump and load</text><text x="500" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Arms swing up. Draw the</text><text x="500" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">hitting elbow back, high</text>
<line x1="560" y1="200" x2="640" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<ellipse cx="700" cy="302" rx="26" ry="5" fill="#c9d3e3"/>
<circle cx="710.388" cy="90.1191" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M708 114L702 174"/><path d="M702 174L714 210L706 246"/><path d="M702 174L692 210L688 248"/><path d="M707.52 120L724 88L734 58"/><path d="M707.52 120L718 138L726 158"/></g>
<circle cx="742" cy="44" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<circle cx="700" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="700" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">4</text><text x="700" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Contact</text><text x="700" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Reach high, hit the top</text><text x="700" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">back of the ball and snap</text><text x="700" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">the wrist</text>
</svg>
