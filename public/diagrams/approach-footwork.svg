ystem-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle">small</text><text x="175" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6578" text-anchor="middle">slow</text><text x="320" y="205" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle">longer</text><text x="320" y="223" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6578" text-anchor="middle">faster</text><text x="500" y="262" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle">big, low</text><text x="500" y="280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6578" text-anchor="middle">fast</text><text x="575" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle">quick close</text><rect x="150" y="312" width="470" height="34" rx="17" fill="#fff" stroke="#c9d3e3"/><text x="385" y="334" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f1f3d" text-anchor="middle">Rhythm:  slow  …  quicker  …  quick-quick</text>
