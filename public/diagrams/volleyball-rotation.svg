<circle cx="580" cy="290" r="22" fill="#5bbcf2" stroke="#0f1f3d" stroke-width="2"/><text x="580" y="295" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">MB</text>
<circle cx="680" cy="290" r="22" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="680" y="295" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">S</text>
<text x="575" y="420" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6578" text-anchor="middle">S setter · OH outside · MB middle · OPP opposite</text>
<text x="400" y="456" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f1f3d" text-anchor="middle">Zone 1 is the server's spot. Your team rotates each time it wins the serve back from the opponent.</text>
