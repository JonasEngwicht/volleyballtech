<rect width="800" height="470" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Volleyball zones and rotation</text>
<text x="215" y="62" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Court zones (your side of the net)</text>
