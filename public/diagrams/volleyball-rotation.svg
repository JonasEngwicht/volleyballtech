<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Volleyball rotation diagram: six court zones numbered 1 to 6, players rotate clockwise, and a 5-1 starting lineup with the setter in zone 1">
