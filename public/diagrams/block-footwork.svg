<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Block footwork drill from above: three spots along the net, left, middle and right. The blocker starts in the middle, shuffles to one side and blocks, returns, then crosses over to the other side and blocks">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="380" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Block footwork along the net (top view)</text>
<line x1="90" y1="100" x2="710" y2="100" stroke="#0f1f3d" stroke-width="7" stroke-linecap="round"/>
<text x="400" y="84" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6578" text-anchor="middle">NET</text>
<rect x="90" y="104" width="620" height="230" rx="10" fill="#e8f0fd"/>
<rect x="136" y="120" width="68" height="14" rx="7" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<text x="170" y="154" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f1f3d" text-anchor="middle">Left (zone 4)</text>
<rect x="366" y="120" width="68" height="14" rx="7" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<text x="400" y="154" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f1f3d" text-anchor="middle">Middle (zone 3)</text>
<rect x="596" y="120" width="68" height="14" rx="7" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<text x="630" y="154" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f1f3d" text-anchor="middle">Right (zone 2)</text>
<circle cx="400" cy="190" r="20" fill="#5bbcf2" stroke="#0f1f3d" stroke-width="2"/><text x="400" y="195" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">B</text>
<path d="M 380 196 L 196 196" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="172" y="213" width="236" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="290" y="230" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f5fbf" text-anchor="middle">Shuffle: step-close, step-close</text>
<path d="M 420 196 C 480 290, 560 290, 618 170" fill="none" stroke="#0f1f3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="442" y="283" width="236" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="560" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f1f3d" text-anchor="middle">Crossover: 3 steps, then plant</text>
<text x="400" y="358" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="middle">Start in the middle. Move, plant, jump and press at the net, land, return. Alternate sides.</text>
</svg>
