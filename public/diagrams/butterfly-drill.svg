<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Butterfly drill from above: a server line behind each end line serves down the line to a passer in left back, who passes to a target at the net. Players follow their ball: server becomes passer, passer becomes target, target collects the ball and joins the server line on the other side">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="470" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Butterfly drill (top view)</text>
<rect x="100" y="90" width="600" height="300" rx="0" fill="#e8f0fd" stroke="#0f1f3d" stroke-width="3"/>
<line x1="400" y1="72" x2="400" y2="408" stroke="#0f1f3d" stroke-width="6" stroke-linecap="round"/>
<line x1="300" y1="90" x2="300" y2="390" stroke="#0f1f3d" stroke-width="2" stroke-linecap="round"/>
<line x1="500" y1="90" x2="500" y2="390" stroke="#0f1f3d" stroke-width="2" stroke-linecap="round"/>
<circle cx="64" cy="350" r="18" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="64" y="355" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">S</text>
<circle cx="736" cy="130" r="18" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="736" y="135" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">S</text>
<circle cx="180" cy="150" r="18" fill="#5bbcf2" stroke="#0f1f3d" stroke-width="2"/><text x="180" y="155" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">P</text>
<circle cx="620" cy="330" r="18" fill="#5bbcf2" stroke="#0f1f3d" stroke-width="2"/><text x="620" y="335" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">P</text>
<circle cx="350" cy="320" r="18" fill="#ffffff" stroke="#0f1f3d" stroke-width="2"/><text x="350" y="325" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">T</text>
<circle cx="450" cy="160" r="18" fill="#ffffff" stroke="#0f1f3d" stroke-width="2"/><text x="450" y="165" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">T</text>
<circle cx="64" cy="384" r="12" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="64" y="389" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"></text>
<circle cx="736" cy="96" r="12" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="736" y="101" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"></text>
<path d="M84 342 Q400 380 600 334" fill="none" stroke="#0f1f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<path d="M716 138 Q400 100 200 146" fill="none" stroke="#0f1f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<path d="M606 316 Q560 180 470 170" fill="none" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahb)"/>
<path d="M194 164 Q240 300 330 310" fill="none" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahb)"/>
<rect x="188.2" y="213" width="123.6" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="250" y="230" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f5fbf" text-anchor="middle">Pass to target</text>
<rect x="429.7" y="353" width="160.6" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="510" y="370" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f1f3d" text-anchor="middle">Serve down the line</text>
<text x="40" y="442" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="start">S = server line   P = passer   T = target (catches the pass)</text>
<text x="40" y="462" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6578" text-anchor="start">Rotate after each ball: S → P (follow your serve), P → T, T → server line on the other side</text>
</svg>
