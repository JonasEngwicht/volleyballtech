<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Wall spiking drill side view: the player stands 10 to 15 feet from a wall, hits the ball down into the floor a few feet in front of the wall, the ball bounces up off the wall and comes back to the player, who hits again">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="400" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Wall spiking setup (side view)</text>
<line x1="60" y1="330" x2="740" y2="330" stroke="#0f1f3d" stroke-width="4" stroke-linecap="round"/>
<rect x="690" y="60" width="22" height="270" rx="0" fill="#c9d3e3"/>
<text x="701" y="54" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6578" text-anchor="middle">Wall</text>
<circle cx="309.596" cy="166.053" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M308 190L304 250"/><path d="M304 250L318 290L326 330"/><path d="M304 250L294 290L284 330"/><path d="M307.68 196L324 166L334 136"/><path d="M307.68 196L320 212L330 230"/></g>
<circle cx="334" cy="136" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<path d="M 346 142 L 600 326" fill="none" stroke="#0f1f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<path d="M 604 322 L 688 210" fill="none" stroke="#5b6578" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahm)"/>
<path d="M 686 190 Q 520 20 350 122" fill="none" stroke="#5bbcf2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<text x="560" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="1" font-weight="600" fill="#0f1f3d" text-anchor="start"></text>
<rect x="395" y="341" width="330" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="560" y="358" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f1f3d" text-anchor="middle">① Hit down: ball lands 3–5 ft from the wall</text>
<rect x="410" y="95" width="300" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="560" y="112" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5b6578" text-anchor="middle">② Ball bounces off the wall and pops up</text>
<rect x="70" y="95" width="180" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="160" y="112" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f1f3d" text-anchor="middle">③ Reach high, hit again</text>
<line x1="300" y1="370" x2="688" y2="370" stroke="#5b6578" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahm)" marker-start="url(#ahm)"/>
<text x="494" y="390" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">10–15 feet</text>
</svg>
