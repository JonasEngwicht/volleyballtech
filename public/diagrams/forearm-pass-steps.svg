<circle cx="784" cy="150" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<line x1="764" y1="196" x2="778" y2="164" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#ahb)"/>
<circle cx="700" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="700" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">4</text><text x="700" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Finish</text><text x="700" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Legs push up and forward.</text><text x="700" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Arms stay below the</text><text x="700" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">shoulders</text>
</svg>
