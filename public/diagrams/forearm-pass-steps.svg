<circle cx="315.631" cy="148.67" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M310 172L296 230"/><path d="M296 230L316 262L308 300"/><path d="M296 230L286 262L276 300"/><path d="M308.88 178L334 196L360 214"/></g>
<circle cx="384" cy="182" r="11" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/>
<circle cx="300" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="300" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">2</text><text x="300" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Platform</text><text x="300" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Hands together, thumbs side</text><text x="300" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">by side, arms straight</text>
<line x1="360" y1="200" x2="440" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="515.631" cy="148.67" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M510 172L496 230"/><path d="M496 230L516 262L508 300"/><path d="M496 230L486 262L476 300"/><path d="M508.88 178L534 196L560 214"/></g>
