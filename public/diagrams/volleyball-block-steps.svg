<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Four phases of a volleyball block: ready position close to the net with hands at shoulder height, move with a side shuffle or crossover, jump with arms straight up, press the hands over the net and land on both feet">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="480" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Blocking in 4 steps (front-row player at the net)</text>
<line x1="40" y1="300" x2="760" y2="300" stroke="#0f1f3d" stroke-width="4" stroke-linecap="round"/>
<circle cx="100" cy="142" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M100 166L100 226"/><path d="M100 226L110 264L110 300"/><path d="M100 226L90 264L90 300"/><path d="M100 172L120 190L126 160"/><path d="M100 172L112 188L118 158"/></g>
<circle cx="100" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="100" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">1</text><text x="100" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Ready</text><text x="100" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">An arm's length from the</text><text x="100" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">net, hands up at shoulder</text><text x="100" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">height</text>
<line x1="160" y1="200" x2="240" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="319.114" cy="153.078" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M312 176L294 234"/><path d="M294 234L314 264L306 300"/><path d="M294 234L284 264L274 300"/><path d="M310.56 182L328 202L346 210"/></g>
<circle cx="300" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="300" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">2</text><text x="300" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Move</text><text x="300" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Shuffle or crossover step</text><text x="300" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">to the hitter. Watch the</text><text x="300" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">hitter, not the ball</text>
<line x1="360" y1="200" x2="440" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<ellipse cx="500" cy="302" rx="26" ry="5" fill="#c9d3e3"/>
<circle cx="500" cy="96" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M500 120L500 180"/><path d="M500 180L508 218L506 256"/><path d="M500 180L492 218L494 256"/><path d="M500 126L524 96L530 64"/><path d="M500 126L516 94L522 62"/></g>
<circle cx="500" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="500" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">3</text><text x="500" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Jump</text><text x="500" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Jump straight up with your</text><text x="500" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">hands up close to the net</text>
<line x1="560" y1="200" x2="640" y2="200" stroke="#c9d3e3" stroke-width="3" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="700" cy="142" r="17" fill="#0f1f3d"/><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M700 166L700 226"/><path d="M700 226L710 264L710 300"/><path d="M700 226L690 264L690 300"/><path d="M700 172L720 190L726 160"/><path d="M700 172L712 188L718 158"/></g>
<circle cx="700" cy="334" r="13" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="700" y="339" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle">4</text><text x="700" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">Press and land</text><text x="700" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">Reach over and press the</text><text x="700" y="406" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">hands down, then land on</text><text x="700" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6578" text-anchor="middle">both feet</text>
</svg>
