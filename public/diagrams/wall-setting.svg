<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-label="Side view of a player setting a volleyball against a wall from two to three feet away">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker>
</defs>
<rect width="800" height="356" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Wall setting setup (side view)</text><line x1="60" y1="300" x2="740" y2="300" stroke="#0f1f3d" stroke-width="4" stroke-linecap="round"/><rect x="690" y="56" width="22" height="244" fill="#c9d3e3"/><text x="701" y="50" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6578" text-anchor="middle">Wall</text><rect x="682" y="62" width="8" height="40" rx="4" fill="#ffc627"/><text x="550" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="end">Target above</text><text x="550" y="94" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="end">your head</text><g stroke="#0f1f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M574 174L566 230"/><path d="M566 230L596 262L578 296"/><path d="M566 230L568 264L546 296"/><path d="M574 176L596 150L590 116"/></g><circle cx="580" cy="150" r="17" fill="#0f1f3d"/><circle cx="598" cy="96" r="12" fill="#fff" stroke="#5bbcf2" stroke-width="3"/><path d="M606 84 Q640 40 682 78" fill="none" stroke="#5b6578" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ahm)"/><line x1="580" y1="318" x2="688" y2="318" stroke="#5b6578" stroke-width="2" marker-start="url(#ahm)" marker-end="url(#ahm)"/><text x="634" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle">2–3 ft</text><text x="70" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start">① Hands above your forehead</text><text x="70" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start">② Thumbs and index fingers</text><text x="92" y="150" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start">form a triangle</text><text x="70" y="176" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start">③ Ball on the finger pads</text><text x="70" y="202" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start">④ Bend, then extend your legs</text><g transform="translate(330 150)"><circle r="46" fill="#fff" stroke="#c9d3e3" stroke-width="2"/><path d="M0 -22L24 16H-24z" fill="none" stroke="#5bbcf2" stroke-width="6" stroke-linejoin="round"/></g><text x="330" y="222" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#5b6578" text-anchor="middle">hand "window"</text>
</svg>
