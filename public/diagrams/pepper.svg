<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Pepper drill from above: two partners 15 to 20 feet apart. A digs to B, B sets back to A, A hits a controlled ball at B. Then B digs, A sets, B hits, and so on">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1f3d"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6578"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker></defs>
<rect width="800" height="400" rx="16" fill="#f3f6fb"/>
<text x="400" y="34" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle">Pepper: dig, set, hit (top view)</text>
<rect x="120" y="80" width="560" height="260" rx="14" fill="#e8f0fd"/>
<path d="M230 197 Q400 60 570 197" fill="none" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahb)"/>
<rect x="308.6" y="89" width="182.8" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="400" y="106" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f5fbf" text-anchor="middle">① A digs (passes) to B</text>
<path d="M566 211 Q400 150 234 211" fill="none" stroke="#5b6578" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahm)"/>
<rect x="312.3" y="155" width="175.4" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="400" y="172" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5b6578" text-anchor="middle">② B sets it back to A</text>
<path d="M232 229 Q400 330 568 229" fill="none" stroke="#0f1f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<rect x="275.3" y="277" width="249.4" height="24" rx="12" fill="#ffffff" stroke="#c9d3e3" stroke-width="1.5"/><text x="400" y="294" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f1f3d" text-anchor="middle">③ A hits a controlled ball at B</text>
<circle cx="210" cy="215" r="22" fill="#5bbcf2" stroke="#0f1f3d" stroke-width="2"/><text x="210" y="220" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">A</text>
<circle cx="590" cy="215" r="22" fill="#ffc627" stroke="#0f1f3d" stroke-width="2"/><text x="590" y="220" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle">B</text>
<text x="210" y="263" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6578" text-anchor="middle">Player A</text>
<text x="590" y="263" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6578" text-anchor="middle">Player B</text>
<text x="400" y="378" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="middle">Then B digs to A, A sets to B, B hits at A. Keep the ball alive as long as you can.</text>
</svg>
